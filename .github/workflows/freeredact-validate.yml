name: FreeRedact candidate checks
on:
  pull_request:
    paths:
      - 'tools/freeredact/**'
      - '.github/workflows/freeredact-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium
      - name: Check code, logic and full browser smoke
        working-directory: tools/freeredact
        run: |
          npm run check
          npm test
          python tests/offline_browser_regression.py
          python tests/export_integrity.py
          python tests/mobile_touch_offline.py
          python tests/browser_smoke.py
